# LinkX fuzz targets：协议解析路径必须对任意输入不崩溃
# 使用 cargo-fuzz（需 nightly）：cargo +nightly fuzz run parse_frame_header
# 与主 workspace 独立（避免 toolchain 冲突），通过 path 引用 linkx-protocol。
[package]
name = "linkx-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# cargo-fuzz 识别标记（缺此则 `cargo fuzz run --fuzz-dir Tests/fuzz` 拒绝运行）
[package.metadata]
cargo-fuzz = true

# 独立 workspace 根：fuzz 需 nightly + sanitizer，与主 workspace 工具链隔离。
# 缺此声明时 `cargo check --manifest-path Tests/fuzz/Cargo.toml` 会报
# "current package believes it's in a workspace when it's not"。
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
linkx-protocol = { path = "../../Crates/protocol" }
linkx-crypto = { path = "../../Crates/crypto" }
linkx-transfer = { path = "../../Crates/transfer" }
prost = "0.12.6"

[profile.release]
panic = "abort"
codegen-units = 1

[[bin]]
name = "parse_frame_header"
path = "fuzz_targets/parse_frame_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_payload_protobuf"
path = "fuzz_targets/parse_payload_protobuf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "noise_handshake_parser"
path = "fuzz_targets/noise_handshake_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitize_filename"
path = "fuzz_targets/sanitize_filename.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_resume"
path = "fuzz_targets/decode_resume.rs"
test = false
doc = false
bench = false
