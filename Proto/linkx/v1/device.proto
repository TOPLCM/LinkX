// 手机设备状态（电量上报）
//
// 口径：LinkX 只同步"手机现在什么状态"这一类小标量，走的是与媒体状态同一条
// 已加密会话通道，不上云、不落盘。
syntax = "proto3";
package linkx.v1;

/// 手机侧设备状态（DEVICE_STATUS 0x82 的 body；手机 → 电脑）
message DeviceStatus {
  // 电量百分比 0-100；-1 = 系统没给读数（少见，但宁可显式表达也不知道）
  int32 battery = 1;
  // 是否在充电/接电源：电脑侧据此把图标切成"充电中"
  bool charging = 2;
  // 本状态产生时刻（手机侧时钟）：对端据此丢弃迟到的旧状态
  int64 ts_ms = 3;
}
